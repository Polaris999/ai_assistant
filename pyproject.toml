[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-agent"
version = "1.0.0"
description = "会议预定 Agent（LangChain + LangGraph + 胶水层 + RAG）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "requests>=2.31.0",
    "chromadb>=0.4.0",
    "langchain-chroma>=0.1.0",
    "SpeechRecognition>=3.10.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "ruff>=0.4",
]
# 本地 Embeddings + 本地 Whisper
local = [
    "sentence-transformers>=2.2.0",
    "faster-whisper>=1.0.0",
]
# OpenAI / Whisper API
openai = [
    "openai>=1.0.0",
    "langchain-openai>=0.2.0",
]
# Qdrant
qdrant = [
    "langchain-qdrant>=2.0.0",
    "qdrant-client>=1.7.0",
]
# Weaviate（Dify 默认向量库）
weaviate = [
    "langchain-weaviate>=0.0.20",
    "weaviate-client>=4.4.0",
]

[project.scripts]
meeting-agent = "meeting_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]
exclude = ["data", "chroma_db", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["meeting_agent"]
