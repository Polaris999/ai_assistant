[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "1.0.0"
description = "统一对话助手（LangChain + LangGraph + RAG，支持会议预定等能力）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.0,<0.4",
    "langchain-text-splitters>=0.3.0,<0.4",
    "langgraph>=0.2.0,<0.3",
    "requests>=2.32.0",
    "chromadb>=0.4.0",
    "langchain-chroma>=0.1.0",
    "SpeechRecognition>=3.10.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.0.0,<3",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "ruff>=0.4",
]
# OpenAI 兼容（LLM/Embeddings 用 openai 或自建 api 时）
openai = [
    "openai>=1.0.0",
    "langchain-openai>=0.2.0",
]
# Qdrant
qdrant = [
    "langchain-qdrant>=2.0.0",
    "qdrant-client>=1.7.0",
]
# Weaviate（Dify 默认向量库）
weaviate = [
    "langchain-weaviate>=0.0.20",
    "weaviate-client>=4.4.0",
]
# 可观测：OpenTelemetry 链路（可选 pip install -e '.[otel]'）
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.scripts]
ai-assistant = "ai_assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]
exclude = ["data", "chroma_db", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ai_assistant"]
