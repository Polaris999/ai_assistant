<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对话示例 - /api/v1/chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    label { display: block; margin-top: 1rem; font-weight: 500; }
    textarea { width: 100%; min-height: 80px; padding: 8px; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 8px 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 1rem; padding: 12px; background: #f1f5f9; border-radius: 6px; white-space: pre-wrap; }
    .error { background: #fee2e2; }
  </style>
</head>
<body>
  <h1>对话示例 (POST /api/v1/chat)</h1>
  <p>输入内容后提交，会调用 <code>POST /api/v1/chat</code>（闲聊、订会、取消、查会议室等）。</p>
  <form id="form">
    <label for="text">输入内容 (text)</label>
    <textarea id="text" name="text" placeholder="例如：查询会议室 / 明天下午3点开项目会1小时 / 取消刚定的">查询会议室</textarea>
    <button type="submit">发送</button>
  </form>
  <div id="result" class="result" style="display:none;"></div>

  <script>
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const text = document.getElementById('text').value.trim();
      const resultEl = document.getElementById('result');
      resultEl.style.display = 'block';
      resultEl.className = 'result';
      resultEl.textContent = '请求中...';
      try {
        const res = await fetch('http://localhost:8000/api/v1/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ text: text })
        });
        const body = await res.text();
        resultEl.textContent = res.ok ? body : 'HTTP ' + res.status + '\n' + body;
        if (!res.ok) resultEl.classList.add('error');
      } catch (err) {
        resultEl.textContent = '请求失败: ' + err.message;
        resultEl.classList.add('error');
      }
    };
  </script>
</body>
</html>
